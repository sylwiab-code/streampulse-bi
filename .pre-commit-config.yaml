# Local quality gate; CI runs the same configuration (ADR-001, D5 and D6).
# Hook versions are pinned to commit SHAs; update with `uv run pre-commit autoupdate --freeze`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: ef6cf06c079dd6b299dfc720b0f14400c9d168e1  # frozen: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 0a7c698408dc56e5efcbe37edc1ec23c782c003b  # frozen: 4.5.0
    hooks:
      - id: sqlfluff-lint
        files: ^(transform|database)/.*\.sql$

  - repo: https://github.com/gitleaks/gitleaks
    rev: 2ca41cc1372d1e939a6a879f18cdc19fc1cac1ce  # frozen: v8.30.0
    hooks:
      - id: gitleaks
      # Same pinned gitleaks, scanning the whole git history. Runs in CI, or locally with
      # `uv run pre-commit run gitleaks-history --hook-stage manual`.
      # always_run: without staged files (as in CI) pre-commit would otherwise skip the hook.
      - id: gitleaks
        alias: gitleaks-history
        name: Detect hardcoded secrets (full git history)
        entry: gitleaks git --redact --verbose
        stages: [manual]
        always_run: true

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint
