unit_tests:
  - name: incremental_events_pick_up_late_rows_and_drop_duplicates
    description: >
      In an incremental run, only rows loaded after the last run are read: an event that
      happened days earlier but arrives late is picked up, an already loaded event is skipped,
      and a duplicate sent twice in the same batch is kept once.
    model: stg_streampulse__subscription_events
    overrides:
      macros:
        is_incremental: true
    given:
      - input: source('streampulse_raw', 'subscription_events')
        rows:
          - {event_id: 1, subscription_id: 10, event_type: trial_started,
             event_at: "2025-03-01 10:00:00", _loaded_at: "2025-03-01 23:00:00",
             _file_name: "subscription_events/load_date=2025-03-01/data.parquet",
             _file_row_number: 1}
          - {event_id: 2, subscription_id: 10, event_type: trial_converted,
             event_at: "2025-03-02 10:00:00", _loaded_at: "2025-03-05 23:00:00",
             _file_name: "subscription_events/load_date=2025-03-05/data.parquet",
             _file_row_number: 1}
          - {event_id: 3, subscription_id: 11, event_type: trial_started,
             event_at: "2025-03-05 09:00:00", _loaded_at: "2025-03-05 23:00:00",
             _file_name: "subscription_events/load_date=2025-03-05/data.parquet",
             _file_row_number: 2}
          - {event_id: 3, subscription_id: 11, event_type: trial_started,
             event_at: "2025-03-05 09:00:00", _loaded_at: "2025-03-05 23:00:00",
             _file_name: "subscription_events/load_date=2025-03-05/data.parquet",
             _file_row_number: 3}
      - input: this
        rows:
          - {event_id: 1, subscription_id: 10, event_type: trial_started,
             event_at: "2025-03-01 10:00:00", loaded_at: "2025-03-01 23:00:00"}
    expect:
      rows:
        - {event_id: 2, event_type: trial_converted, event_at: "2025-03-02 10:00:00"}
        - {event_id: 3, event_type: trial_started, event_at: "2025-03-05 09:00:00"}
