version: 2

# The Power BI semantic model (Phase 5, ADR-011) and the reports built on it (Phase 6), with
# the dbt models each one reads through the model; URLs follow in Phase 7.
exposures:
  - name: powerbi_semantic_model
    label: StreamPulse semantic model
    type: application
    maturity: medium
    description: >
      Power BI Import model in semantic/powerbi (TMDL). Row-level security reads the
      security_market_access seed.
    owner:
      name: Global BI
    depends_on:
      - ref('dim_date')
      - ref('dim_market')
      - ref('dim_plan')
      - ref('dim_channel')
      - ref('dim_campaign')
      - ref('dim_content')
      - ref('dim_customer')
      - ref('kpi_subscribers_daily')
      - ref('kpi_churn_monthly')
      - ref('kpi_trial_conversion_monthly')
      - ref('kpi_cohort_retention')
      - ref('kpi_cac_ltv_monthly')
      - ref('kpi_de_mrr_net_of_vat')
      - ref('fct_mrr_movements')
      - ref('fct_payments')
      - ref('fct_viewing_sessions')
      - ref('security_market_access')

  - name: executive_report
    label: Executive overview
    type: dashboard
    maturity: low
    description: Subscribers, MRR and ARR, the MRR bridge, churn, and ARPU.
    owner:
      name: Global BI
    depends_on:
      - ref('kpi_subscribers_daily')
      - ref('fct_mrr_movements')
      - ref('kpi_churn_monthly')

  - name: churn_report
    label: Churn and retention
    type: dashboard
    maturity: low
    description: Voluntary and involuntary churn, cohort retention, and trial conversion.
    owner:
      name: Global BI
    depends_on:
      - ref('kpi_churn_monthly')
      - ref('kpi_cohort_retention')
      - ref('kpi_trial_conversion_monthly')

  - name: content_report
    label: Content and engagement
    type: dashboard
    maturity: low
    description: Watch hours by genre and content performance per title.
    owner:
      name: Global BI
    depends_on:
      - ref('fct_viewing_sessions')
      - ref('dim_content')

  - name: market_report
    label: Market performance
    type: dashboard
    maturity: low
    description: Acquisition cost and lifetime value per market and channel, plus local views.
    owner:
      name: Global BI
    depends_on:
      - ref('kpi_cac_ltv_monthly')
      - ref('kpi_de_mrr_net_of_vat')
