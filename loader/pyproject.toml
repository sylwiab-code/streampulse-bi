[project]
name = "streampulse-loader"
version = "0.1.0"
description = "Loads StreamPulse Parquet batches into the Snowflake raw layer"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "snowflake-connector-python>=5.2.0",
]

[project.scripts]
load = "streampulse_loader.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"
