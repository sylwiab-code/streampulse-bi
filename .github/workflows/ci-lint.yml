name: ci-lint

on:
  pull_request:
    # "edited" re-runs the workflow when the PR title changes. Every job runs on every
    # event, because a skipped job would count as a passing required check.
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.7"
      - name: Install developer tools
        run: uv sync --locked
      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run all hooks on all files
        env:
          # no-commit-to-branch guards local commits only; it always fails when run on main.
          SKIP: ${{ github.ref == 'refs/heads/main' && 'no-commit-to-branch' || '' }}
        run: uv run pre-commit run --all-files --show-diff-on-failure --color always

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.7"
      - name: Install developer tools
        run: uv sync --locked
      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Scan the full git history for secrets
        run: uv run pre-commit run gitleaks-history --hook-stage manual --color always

  pr-title:
    name: pr-title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check that the PR title follows Conventional Commits
        if: github.event_name == 'pull_request'
        env:
          # Passed as an environment variable, never interpolated into the script (injection).
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|chore|refactor|perf|test|build|ci|style|revert)(\([a-z0-9-]+\))?!?: [^[:space:]].*$'
          if [[ "$TITLE" =~ $pattern ]]; then
            echo "The PR title follows Conventional Commits."
          else
            echo "::error::The PR title must follow Conventional Commits, for example 'feat(dbt): add churn KPI'."
            exit 1
          fi
