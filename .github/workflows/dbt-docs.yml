name: dbt-docs

# Publishes the dbt documentation site to GitHub Pages after every merge to main (ADR-002).
# Built without a warehouse connection: descriptions, lineage, tests, and KPI meta are
# included; column statistics from the warehouse are not.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dbt-docs
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.7"
      - name: Install developer tools
        run: uv sync --locked
      - name: Generate the documentation site
        working-directory: transform/dbt
        env:
          DBT_PROFILES_DIR: .
          SNOWFLAKE_ACCOUNT: offline
          SNOWFLAKE_USER: offline
          SNOWFLAKE_PRIVATE_KEY_PATH: offline
        run: |
          uv run dbt deps
          uv run dbt parse
          uv run dbt docs generate --no-compile --empty-catalog --static
          mkdir -p ../../site
          cp target/static_index.html ../../site/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
