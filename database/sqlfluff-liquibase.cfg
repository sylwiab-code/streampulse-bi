[sqlfluff]
# Liquibase changelogs use ${name} parameters; lint them as placeholders. Loaded through
# --config by the sqlfluff-lint-liquibase pre-commit hook (a subfolder .sqlfluff cannot
# change the templater).
templater = placeholder

[sqlfluff:templater:placeholder]
# Also matches parameters inside identifiers such as wh_load_${env}.
param_regex = \$\{(?P<param_name>\w+)\}
