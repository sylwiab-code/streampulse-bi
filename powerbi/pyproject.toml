[project]
name = "streampulse-powerbi"
version = "0.1.0"
description = "Power BI REST client for StreamPulse: semantic model refresh and validation"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = ["streampulse-loader"]

[project.scripts]
powerbi = "streampulse_powerbi.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
streampulse-loader = { workspace = true }
